name: tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WANDB_MODE: offline
  CUDA_VISIBLE_DEVICES: ""

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU torch
        run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      # triton is imported unconditionally by nn/modules/cg_product.py, but the CPU torch wheel does not depend on it
      # (the kernel itself is only used on CUDA tensors).
      # schnetpack 2.1.1 pins sympy<=1.12 but torch>=2.6 needs sympy>=1.13, so pip cannot
      # resolve them together (same workaround as apptainer/equiv_dens.def).
      - name: Install package and pytest
        run: |
          grep -vi '^schnetpack' requirements.txt > /tmp/req-nosp.txt
          pip install -e . -r /tmp/req-nosp.txt pytest triton
          pip install --no-deps "schnetpack>=2.1.1"
          pip install $(pip show schnetpack | sed -n 's/^Requires: //p' | tr ',' '\n' | tr -d ' ' | grep -vix sympy)
      - name: Unit tests
        run: pytest tests/test_*.py -v -rs
      - name: Smoke train (joint)
        run: python run.py train --mode joint @config/training/h2o_small_all_001.txt @config/training/test_overrides.txt --use_gpu=False --save_dir=scratch/ci_joint --max_steps=10
      - name: Smoke train (density)
        run: python run.py train --mode density @config/training/h2o_small_all_001.txt @config/training/test_overrides.txt --use_gpu=False --save_dir=scratch/ci_density --max_steps=10
