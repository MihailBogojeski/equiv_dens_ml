[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equiv-dens"
version = "0.1"
description = "A package for density functional approximation using machine learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mihail Bogojeski", email = "m.bogojeski@tu-berlin.de"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
equiv-dens = "equiv_dens.cli:main"

[project.optional-dependencies]
gpu-cuda11 = ["gpu4pyscf-cuda11x", "cutensor-cu11"]
gpu-cuda12 = ["gpu4pyscf-cuda12x", "cutensor-cu12"]
gpu-cuda13 = ["gpu4pyscf-cuda13x", "cutensor-cu13"]
cupy-dipole = ["cupy"]  # GPU dipole integrals; use cupy-cuda12x etc. to match CUDA

[tool.setuptools.packages.find]
where = ["src"]
